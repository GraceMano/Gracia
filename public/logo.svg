<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Emerald Left Leg -->
    <linearGradient id="fullLegLeft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Bright Mint Right Leg -->
    <linearGradient id="fullLegRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Crossbar -->
    <linearGradient id="fullCrossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- ICON BADGE (x: 10, y: 10, w: 90, h: 90) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="90" height="90" rx="22" fill="url(#iconBgA)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.4"/>

    <!-- Subtle Topo Arc -->
    <path d="M14 74 Q45 62 76 74" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Left Leg of the 'A' -->
    <path d="M45 16 L19 75 H31 L42 50 L45 42 Z" fill="url(#fullLegLeft)"/>

    <!-- Right Leg of the 'A' -->
    <path d="M45 16 L71 75 H59 L48 50 L45 42 Z" fill="url(#fullLegRight)"/>

    <!-- Apex Cap -->
    <circle cx="45" cy="16" r="2.8" fill="#34d399"/>

    <!-- Contour/Leaf Crossbar forming the 'A' bar -->
    <path d="M26 54 Q45 45 64 54 Q45 50 26 54 Z" fill="url(#fullCrossbar)"/>
    <path d="M28 54 Q45 47 62 54" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>

    <!-- Golden Node Pin inside the upper apex -->
    <circle cx="45" cy="34" r="2.5" fill="url(#goldDot)"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(122, 22)">
    <!-- "Agrsmart" Text -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5px">
      <tspan fill="#10b981">Agr</tspan>
      <tspan fill="#f8fafc">smart</tspan>
    </text>

    <!-- Geographic Node Point on the 'i' of smart or dot -->
    <circle cx="168" cy="16" r="3.5" fill="#10b981"/>

    <!-- Tagline & Description -->
    <text x="2" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5px">
      OBSERVATOIRE DE L'ÉROSION DES SOLS
    </text>

    <!-- Location Pill -->
    <g transform="translate(2, 74)">
      <rect x="0" y="0" width="138" height="18" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="8" cy="9" r="2.5" fill="#10b981"/>
      <text x="15" y="12.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.5px">
        KABARE • SUD-KIVU
      </text>
    </g>
  </g>
</svg>
