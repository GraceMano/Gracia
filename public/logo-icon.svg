<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Emerald Gradient for the Left Leg -->
    <linearGradient id="legLeft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Brighter Mint Gradient for the Right Leg -->
    <linearGradient id="legRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Crossbar / Leaf Terrace Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Accent Dot -->
    <linearGradient id="accentDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Container Tile with Rounded Corners -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgA)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Subtle Topo Arc in background behind the A -->
  <path d="M18 78 Q50 64 82 78" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M26 84 Q50 72 74 84" stroke="#047857" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Left Leg of the 'A' -->
  <path d="M50 18 L24 82 L37 82 L47 57 L50 49 Z" fill="url(#legLeft)"/>

  <!-- Right Leg of the 'A' -->
  <path d="M50 18 L76 82 L63 82 L53 57 L50 49 Z" fill="url(#legRight)"/>

  <!-- Apex Top Cap -->
  <circle cx="50" cy="18" r="3" fill="#34d399"/>

  <!-- Modern Leaf / Contour Crossbar forming the 'A' bar -->
  <path d="M30 60 Q50 50 70 60 Q50 56 30 60 Z" fill="url(#crossbarGrad)"/>
  <path d="M33 60 Q50 52 67 60" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Sprout Point / Node in the inner 'A' counter -->
  <circle cx="50" cy="40" r="2.8" fill="url(#accentDot)"/>
</svg>
